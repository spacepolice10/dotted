<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#f4f4ef">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>Something went wrong · Dotted</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        color: light-dark(#252621, #f0f0e9);
        background: light-dark(#f4f4ef, #1d201d);
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100svh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: clamp(1.25rem, 5vw, 3rem);
        background-image: radial-gradient(light-dark(#c9cbc2, #454a43) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      main {
        position: relative;
        isolation: isolate;
        width: min(100%, 31rem);
        padding: clamp(1.5rem, 7vw, 3.5rem);
        overflow: hidden;
        border: 1px solid light-dark(#dedfd6, #3e443d);
        border-radius: 1.5rem;
        background: light-dark(#fffefa, #282c27);
        box-shadow: 0 14px 40px light-dark(#1c251514, #0005);
        text-align: center;
      }
      main::before {
        content: "";
        position: absolute;
        z-index: -1;
        width: 17rem;
        height: 17rem;
        top: -10rem;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: light-dark(#c9e7e8, #31585a);
        filter: blur(2px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: .55rem;
        color: inherit;
        font-size: .95rem;
        font-weight: 700;
        text-decoration: none;
      }
      .brand img { width: 1.6rem; height: 1.6rem; }
      .scene {
        display: grid;
        justify-items: center;
        gap: .75rem;
        margin: clamp(2rem, 7vw, 3rem) 0 1.25rem;
      }
      .code {
        color: light-dark(#427e81, #9bd4d3);
        font-size: clamp(3rem, 15vw, 5.75rem);
        font-weight: 800;
        letter-spacing: -.09em;
        line-height: .9;
      }
      .marker {
        width: 3.2rem;
        height: .35rem;
        border-radius: 99px;
        background: #e8b94f;
        rotate: -4deg;
      }
      h1 {
        max-width: 18ch;
        margin: 0 auto .8rem;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1.65rem, 6vw, 2.3rem);
        font-weight: 750;
        letter-spacing: -.04em;
        line-height: 1.08;
        text-wrap: balance;
      }
      p {
        max-width: 39ch;
        margin: 0 auto;
        color: light-dark(#686b63, #b1b7ad);
        font-size: .95rem;
        line-height: 1.65;
        text-wrap: pretty;
      }
      .action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: .75rem;
        min-height: 2.9rem;
        margin-top: 1.75rem;
        padding: .7rem 1.1rem;
        border: 1px solid light-dark(#252621, #f0f0e9);
        border-radius: 999px;
        background: light-dark(#252621, #f0f0e9);
        color: light-dark(#fffefa, #252621);
        font: 600 .9rem/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        text-decoration: none;
        cursor: pointer;
      }
      .action:focus-visible { outline: 3px solid #71b7bb; outline-offset: 3px; }
      .action:hover { transform: translateY(-1px); }
      @media (prefers-reduced-motion: reduce) { .action:hover { transform: none; } }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/" aria-label="Dotted home">
        <img src="/icon.svg" alt="" width="26" height="26">
        <span>Dotted</span>
      </a>
      <div class="scene" aria-hidden="true">
        <span class="code">500</span>
        <span class="marker"></span>
      </div>
      <h1>A small hiccup</h1>
      <p>Something went wrong on our side. Give it a moment, then try again.</p>
      <a class="action" href="/"><span>Back to your daylog</span><span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
