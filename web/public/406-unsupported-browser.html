<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <title>Unsupported browser · Dotted</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        text-align: center;
        background: #f5f5f5;
        color: #2b2b30;
      }
      main {
        display: grid;
        gap: 0.75rem;
        place-items: center;
        max-width: 28rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin: 0 0 0.5rem;
        font-size: 0.95rem;
        font-weight: 600;
        color: inherit;
        text-decoration: none;
      }
      .brand img {
        width: 1.75rem;
        height: 1.75rem;
      }
      h1 {
        margin: 0;
        font-size: 1.5rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #6f6e69;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #141414; color: #e6e6e6; }
        p { color: #a29f96; }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="brand">
        <img src="/icon.svg" alt="" width="28" height="28">
        Dotted
      </span>
      <h1>Unsupported browser</h1>
      <p>Your browser is not supported. Please upgrade to continue.</p>
    </main>
  </body>
</html>
